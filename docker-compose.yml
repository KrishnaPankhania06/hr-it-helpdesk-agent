# Optional convenience: a real Postgres container if you prefer it over the
# built-in embedded Postgres (pgserver). The app works either way - set
# DATABASE_URL=postgresql://postgres:postgres@localhost:5432/hr_demo to use this.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hr_demo
    ports:
      - "5432:5432"
